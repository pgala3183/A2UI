<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--VIEW_KIT-->
</head>
<body>
  <div id="title" class="k-muted">Waiting for the generated widget...</div>
  <div id="slot"></div>
  <script>
    // An open-ended view is only a shell: it mounts whatever HTML the tool returned
    // in a nested sandbox and relays the widget's actions to the server.
    const { app, mountGenerated } = viewKit;
    let widget = null;
    let data = {};

    app.on('ui/notifications/tool-result', (result) => {
      const { title, html, data: initial } = result.structuredContent ?? {};
      if (!html) return;
      document.getElementById('title').textContent = `${title} - generated by the server's model, nested sandbox`;
      data = initial ?? {};
      widget = mountGenerated(document.getElementById('slot'), html, { onAction, height: 300 });
      widget.send(data);
    });

    async function onAction(name, payload) {
      if (name !== 'book_ride') return; // the shell decides which widget actions exist
      const result = await app.callServerTool('book_ride', { minutes: payload.minutes, ebike: payload.ebike, member: payload.member });
      const text = result.content?.[0]?.text ?? '';
      data = { ...data, message: text };
      widget.send(data);
      if (!result.isError) {
        await app.updateModelContext(text, result.structuredContent);
        await app.sendMessage(`I booked ${result.structuredContent.reference} for $${result.structuredContent.price.toFixed(2)}.`);
      }
    }

    app.connect({ name: 'Generated widget shell', version: '1.0.0' });
  </script>
</body>
</html>
